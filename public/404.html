<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>RCPL Services — Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.

      // If you are deploying to https://<USERNAME>.github.io/<REPO>/,
      // pathSegmentsToKeep should be 1.
      // If deploying to a custom domain (https://example.com/), pathSegmentsToKeep should be 0.
      var pathSegmentsToKeep = window.location.pathname.indexOf('/rcpl-services') === 0 ? 1 : 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 40px; background: #FCFCFA; color: #152E4D;">
    <p>Redirecting to RCPL Services...</p>
    <p style="font-size: 13px; color: #6C7A89;">If you are not redirected automatically, <a href="/" style="color: #B28348;">click here to continue</a>.</p>
  </body>
</html>
