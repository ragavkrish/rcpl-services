name: Deploy React + Vite site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build website for rcplservices.com
        run: npm run build
        env:
          # Custom domain production requires root base path '/'
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}

      - name: Ensure 404.html and CNAME exist for SPA and Custom Domain
        run: |
          cp dist/index.html dist/404.html
          if [ -f public/CNAME ]; then
            cp public/CNAME dist/CNAME
          else
            echo "rcplservices.com" > dist/CNAME
          fi

      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
